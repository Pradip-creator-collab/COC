<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>View Base — Upgrade Watch</title>
<link rel="icon" href="data:,">
<link rel="stylesheet" href="shared.css">
<style>
  textarea, input {
    font-family: 'Times New Roman', Times, serif !important;
    background: rgba(255, 255, 255, 0.4) !important;
    border: 1px solid rgba(255, 255, 255, 0.7) !important;
    color: #1F2937 !important;
    border-radius: 10px !important;
    font-weight: 600;
    box-shadow: inset 0 2px 6px rgba(0,0,0,0.02);
  }
  textarea:focus, input:focus {
    border-color: rgba(255, 255, 255, 1) !important;
    background: rgba(255, 255, 255, 0.7) !important;
    box-shadow: 0 0 0 4px rgba(255, 255, 255, 0.3) !important;
  }
  textarea::placeholder, input::placeholder { color: #6B7280 !important; opacity: 0.8; }
</style>
</head>
<body>
<div id="root"></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/firebase/12.18.0/firebase-app-compat.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/firebase/12.18.0/firebase-auth-compat.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/firebase/12.18.0/firebase-firestore-compat.min.js"></script>

<script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.23.5/babel.min.js"></script>

<script src="shared.js"></script>

<script type="text/babel" data-presets="react">
const { useState, useEffect, useMemo } = React;

if (!window.__auth || !window.__db) {
  document.getElementById("root").innerHTML =
    '<div style="color:#EDEAE4;padding:24px;font-family:sans-serif;max-width:400px;margin:60px auto;background:#1C1916;border:1px solid #39352E;">' +
    "Couldn't connect (Firebase didn't load). Check your internet connection and reload the page. " +
    "If this keeps happening, shared.js or the Firebase scripts may not be loading correctly." +
    "</div>";
  throw new Error("Firebase failed to initialize — window.__auth/__db missing.");
}

// Order + display titles for each profile section.
const SECTIONS = [
  { key: "heroes", title: "Heroes" },
  { key: "heroes2", title: "Heroes (Builder Base)" },
  { key: "pets", title: "Pets" },
  { key: "units", title: "Troops (Lab)" },
  { key: "units2", title: "Troops (Builder Base Lab)" },
  { key: "spells", title: "Spells (Lab)" },
  { key: "siege_machines", title: "Siege Machines" },
  { key: "guardians", title: "Guardians" },
  { key: "buildings", title: "Buildings" },
  { key: "buildings2", title: "Buildings (Builder Base)" },
  { key: "traps", title: "Traps" },
  { key: "traps2", title: "Traps (Builder Base)" },
];

function normalizeTag(t) {
  let s = (t || "").trim().toUpperCase().replace(/\s+/g, "").replace(/^#*/, "");
  return s ? "#" + s : "";
}

function itemName(id, nameMap) {
  return (nameMap && nameMap[id]) || DEFAULT_NAMES[String(id)] || `#${id}`;
}

function BaseProfile({ uid, readOnly, viewingLabel, onBack, onLogout }) {
  const [villages, setVillages] = useState({});
  const [nameMap, setNameMap] = useState({});
  const [maxLevelMap, setMaxLevelMap] = useState({});
  const [loaded, setLoaded] = useState(false);
  const [tagInput, setTagInput] = useState("");
  const [searchedTag, setSearchedTag] = useState(null);
  const [notFound, setNotFound] = useState(false);
  const [activeFilter, setActiveFilter] = useState(null);

  useEffect(() => {
    let cancelled = false;
    window.__db.collection("users").doc(uid).get().then((snap) => {
      if (cancelled) return;
      const d = snap.data() || {};
      let v = d.villages || {};
      if (Object.keys(v).length === 0 && d.snapshot) {
        const legacyTag = d.snapshot.tag || "main";
        v = { [legacyTag]: { snapshot: d.snapshot, totalBuilders: d.totalBuilders || 6, label: legacyTag } };
      }
      setVillages(v);
      if (d.nameMap) setNameMap(d.nameMap);
      if (d.maxLevelMap) setMaxLevelMap(d.maxLevelMap);
      setLoaded(true);
    }).catch(() => setLoaded(true));
    return () => { cancelled = true; };
  }, [uid]);

  const matchedEntry = useMemo(() => {
    if (!searchedTag) return null;
    const target = normalizeTag(searchedTag);
    const key = Object.keys(villages).find((k) => {
      const village = villages[k];
      const candidate = (village.snapshot && village.snapshot.tag) || k;
      return normalizeTag(candidate) === target || normalizeTag(k) === target;
    });
    return key ? { tag: key, village: villages[key] } : null;
  }, [searchedTag, villages]);

  const handleSubmit = (e) => {
    e.preventDefault();
    if (!tagInput.trim()) return;
    setSearchedTag(tagInput.trim());
    setNotFound(false);
    setActiveFilter(null);
  };

  useEffect(() => {
    if (searchedTag && loaded) setNotFound(!matchedEntry);
  }, [searchedTag, matchedEntry, loaded]);

  const levels = matchedEntry && matchedEntry.village.snapshot ? (matchedEntry.village.snapshot.levels || null) : null;

  return (
    <div style={s.wrapper}>
      <div style={s.container}>
        <div style={s.header}>
          <div>
            <div style={s.eyebrow}>{readOnly ? "Viewing (read-only)" : "Base Lookup"}</div>
            <h1 style={s.title}>{readOnly ? viewingLabel : "View Base"}</h1>
          </div>
          <div style={s.metaBox}>
            <div style={{ display: "flex", gap: 8 }}>
              <button onClick={onBack} style={s.logoutBtn}>← Dashboard</button>
              <button onClick={onLogout} style={s.logoutBtn}>{readOnly ? "Back" : "Log out"}</button>
            </div>
          </div>
        </div>

        <form onSubmit={handleSubmit} style={s.searchRow}>
          <input
            type="text"
            value={tagInput}
            onChange={(e) => setTagInput(e.target.value)}
            placeholder="Enter player tag, e.g. #ABC123"
            style={s.tagInput}
          />
          <button type="submit" className="btn" style={s.submitBtn}>Submit</button>
        </form>

        {!loaded && <div style={s.empty}>Loading your saved villages…</div>}

        {loaded && !searchedTag && (
          <div style={s.footnote}>
            Enter one of your tracked players' tags above and submit to see every hero, pet, troop and building level for that base.
          </div>
        )}

        {loaded && searchedTag && notFound && (
          <div style={s.errorText}>
            Couldn't find a saved village with that tag. Make sure it matches a village you've already imported on the dashboard, then re-import its Export Village Data JSON if you haven't recently.
          </div>
        )}

        {loaded && matchedEntry && !levels && (
          <div style={s.errorText}>
            This village doesn't have full profile data cached yet. Go to the dashboard and re-import that village's Export Village Data JSON once to enable View Base for it.
          </div>
        )}

        {loaded && matchedEntry && levels && (
          <div className="panel-in">
            <div style={s.profileHead}>
              <div style={s.profileName}>{matchedEntry.village.label || matchedEntry.tag}</div>
              <div style={s.profileTag}>{matchedEntry.tag}</div>
            </div>

            {/* Category Filters */}
            <div style={s.filterRow}>
              <button onClick={() => setActiveFilter(null)} style={{ ...s.filterChip, ...(activeFilter === null ? s.filterChipActive : {}) }}>All</button>
              {SECTIONS.map(({ key, title }) => {
                if (!levels[key] || !levels[key].length) return null;
                return (
                  <button key={key} onClick={() => setActiveFilter(key)} style={{ ...s.filterChip, ...(activeFilter === key ? s.filterChipActive : {}) }}>
                    {title}
                  </button>
                );
              })}
            </div>

            {/* Items List */}
            {SECTIONS.map(({ key, title }) => {
              if (activeFilter && activeFilter !== key) return null;
              
              const list = levels[key];
              if (!list || !list.length) return null;
              
              const sorted = [...list].sort((a, b) =>
                itemName(a.id, nameMap).localeCompare(itemName(b.id, nameMap))
              );
              
              return (
                <div key={key} style={s.section}>
                  <div style={s.sectionTitle}>{title}</div>
                  <div style={s.grid}>
                    {sorted.map((it) => (
                      <div key={key + "-" + it.id} style={s.itemCard}>
                        <div style={s.itemName}>{itemName(it.id, nameMap)}</div>
                        <div style={s.itemLevel}>
                          Lv {it.lvl}
                          {maxLevelMap[it.id] ? <span style={s.itemMax}> / {maxLevelMap[it.id]}</span> : null}
                        </div>
                      </div>
                    ))}
                  </div>
                </div>
              );
            })}
          </div>
        )}
      </div>
    </div>
  );
}

function Boot() {
  const [authChecked, setAuthChecked] = useState(false);
  const [user, setUser] = useState(null);
  const [role, setRole] = useState("member");
  const params = new URLSearchParams(window.location.search);
  const viewUid = params.get("viewUid");
  const viewName = params.get("viewName");

  useEffect(() => {
    const unsub = window.__auth.onAuthStateChanged(async (u) => {
      setUser(u);
      if (u) {
        try {
          const snap = await window.__db.collection("users").doc(u.uid).get();
          const d = snap.data() || {};
          setRole(d.role === "admin" ? "admin" : "member");
        } catch (e) {}
      }
      setAuthChecked(true);
    });
    return unsub;
  }, []);

  useEffect(() => {
    if (authChecked && !user) window.location.href = "index.html";
  }, [authChecked, user]);

  if (!authChecked || !user) return <div style={s.wrapper}></div>;

  if (viewUid && role === "admin") {
    return (
      <BaseProfile
        uid={viewUid}
        readOnly={true}
        viewingLabel={viewName || viewUid}
        onBack={() => { window.location.href = "admin.html"; }}
        onLogout={() => { window.location.href = "admin.html"; }}
      />
    );
  }

  return (
    <BaseProfile
      uid={user.uid}
      readOnly={false}
      onBack={() => { window.location.href = "coc-upgrade.html"; }}
      onLogout={() => window.__auth.signOut().then(() => { window.location.href = "index.html"; })}
    />
  );
}

const s = {
  wrapper: { background: "transparent", minHeight: "100vh", padding: "24px 16px", fontFamily: "'Times New Roman', Times, serif" },
  container: { maxWidth: 640, margin: "0 auto", background: "rgba(255, 255, 255, 0.45)", backdropFilter: "blur(20px)", WebkitBackdropFilter: "blur(20px)", border: "1px solid rgba(255, 255, 255, 0.7)", padding: 28, borderRadius: 20, boxShadow: "0 12px 40px rgba(168, 213, 227, 0.25)" },
  header: { display: "flex", justifyContent: "space-between", alignItems: "flex-end", marginBottom: 18 },
  eyebrow: { fontSize: 13, color: "#6B7280", letterSpacing: "0.06em", marginBottom: 4, textTransform: "uppercase", fontWeight: 700 },
  title: { fontFamily: "'Times New Roman', Times, serif", fontWeight: 700, fontSize: 30, color: "#1F2937", margin: 0 },
  metaBox: { display: "flex", flexDirection: "column", alignItems: "flex-end", gap: 6 },
  logoutBtn: { fontSize: 13, fontFamily: "'Times New Roman', Times, serif", color: "#4B5563", background: "rgba(255, 255, 255, 0.5)", border: "1px solid rgba(255, 255, 255, 0.8)", padding: "6px 14px", cursor: "pointer", borderRadius: 8, fontWeight: 700, boxShadow: "0 2px 8px rgba(0,0,0,0.04)", whiteSpace: "nowrap" },

  searchRow: { display: "flex", gap: 10, marginBottom: 20 },
  tagInput: { flex: 1, padding: "10px 14px", fontSize: 15 },
  submitBtn: { border: "1px solid rgba(255,255,255,1)", fontFamily: "'Times New Roman', Times, serif", padding: "10px 20px", fontSize: 14, fontWeight: 700, cursor: "pointer", color: "#374151", background: "rgba(255, 255, 255, 0.8)", borderRadius: 10, boxShadow: "0 4px 12px rgba(0,0,0,0.06)" },

  empty: { color: "#6B7280", fontSize: 15, padding: "32px 4px", textAlign: "center", fontStyle: "italic", fontWeight: 700 },
  footnote: { marginTop: 8, fontSize: 13, color: "#6B7280", lineHeight: 1.6, textAlign: "center", fontWeight: 700 },
  errorText: { color: "#BE123C", fontSize: 14, margin: "10px 0", border: "1px solid rgba(254, 205, 211, 0.8)", padding: "10px 14px", background: "rgba(255, 228, 230, 0.8)", borderRadius: 8, fontWeight: 700, lineHeight: 1.5 },

  profileHead: { textAlign: "center", borderBottom: "1px solid rgba(255,255,255,0.6)", paddingBottom: 16, marginBottom: 10 },
  profileName: { fontSize: 22, fontWeight: 700, color: "#1F2937" },
  profileTag: { fontSize: 13, color: "#6B7280", fontWeight: 700, marginTop: 2 },

  filterRow: { display: "flex", flexWrap: "wrap", gap: 8, marginTop: 16, marginBottom: 16, justifyContent: "center" },
  filterChip: { fontSize: 13, fontFamily: "'Times New Roman', Times, serif", color: "#4B5563", background: "rgba(255, 255, 255, 0.3)", border: "1px solid rgba(255, 255, 255, 0.5)", padding: "6px 14px", cursor: "pointer", borderRadius: 20, fontWeight: 700 },
  filterChipActive: { color: "#1F2937", background: "rgba(255, 255, 255, 0.9)", borderColor: "rgba(255, 255, 255, 1)", boxShadow: "0 4px 12px rgba(0,0,0,0.05)" },

  section: { marginTop: 18 },
  sectionTitle: { fontSize: 12, fontWeight: 700, color: "#374151", marginBottom: 8, textTransform: "uppercase", letterSpacing: "0.04em", opacity: 0.75 },
  grid: { display: "grid", gridTemplateColumns: "repeat(auto-fill, minmax(140px, 1fr))", gap: 8 },
  itemCard: { border: "1px solid rgba(255,255,255,0.6)", background: "rgba(255, 255, 255, 0.35)", borderRadius: 10, padding: "8px 10px" },
  itemName: { fontSize: 13, fontWeight: 700, color: "#1F2937", wordBreak: "break-word" },
  itemLevel: { fontSize: 13, color: "#748CAB", fontWeight: 700, marginTop: 2 },
  itemMax: { color: "#9CA3AF" },
};
ReactDOM.createRoot(document.getElementById("root")).render(<Boot />);
</script>

<script>
setTimeout(function () {
  var root = document.getElementById("root");
  if (root && root.children.length === 0) {
    var lines = [
      "firebase: " + typeof firebase,
      "React: " + typeof React,
      "ReactDOM: " + typeof ReactDOM,
      "Babel: " + typeof Babel,
      "window.__auth: " + typeof window.__auth,
      "window.__db: " + typeof window.__db,
      "window.CATEGORY_MAP: " + typeof window.CATEGORY_MAP,
    ];
    root.innerHTML =
      '<div style="color:#EDEAE4;padding:24px;font-family:monospace;font-size:13px;max-width:420px;margin:60px auto;background:#1C1916;border:1px solid #39352E;line-height:1.6;">' +
      "Diagnostic — nothing rendered after 2.5s:<br><br>" +
      lines.join("<br>") +
      "</div>";
  }
}, 2500);
</script>
</body>
</html>
