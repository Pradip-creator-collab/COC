<script type="text/babel" data-presets="react">
const { useState, useEffect, useMemo, useCallback, useRef } = React;

const BUILDER_CATEGORIES = ["buildings", "buildings2", "traps", "traps2"];

const CATEGORY_MAP = {
  buildings: { label: "Building", color: "#D9A441" },
  buildings2: { label: "Building (Builder Base)", color: "#D9A441" },
  traps: { label: "Trap", color: "#C77B5A" },
  traps2: { label: "Trap (Builder Base)", color: "#C77B5A" },
  heroes: { label: "Hero", color: "#8B5FBF" },
  heroes2: { label: "Hero (Builder Base)", color: "#8B5FBF" },
  units: { label: "Troop (Lab)", color: "#6FAE68" },
  units2: { label: "Troop (Builder Base Lab)", color: "#6FAE68" },
  spells: { label: "Spell (Lab)", color: "#6FAE68" },
  pets: { label: "Pet House", color: "#C77B5A" },
  siege_machines: { label: "Siege Workshop", color: "#D9A441" },
  guardians: { label: "Guardian", color: "#8B5FBF" },
};

function usernameToEmail(username) {
  return `${username.trim().toLowerCase().replace(/[^a-z0-9_.-]/g, "")}@coc-tracker.local`;
}

function formatRemaining(ms) {
  if (ms <= 0) return "Ready";
  const totalSec = Math.floor(ms / 1000);
  const days = Math.floor(totalSec / 86400);
  const hours = Math.floor((totalSec % 86400) / 3600);
  const mins = Math.floor((totalSec % 3600) / 60);
  const secs = totalSec % 60;
  if (days > 0) return `${days}d ${hours}h ${mins}m`;
  if (hours > 0) return `${hours}h ${mins}m ${secs}s`;
  if (mins > 0) return `${mins}m ${secs}s`;
  return `${secs}s`;
}
function formatClockTime(ms) {
  return new Date(ms).toLocaleString(undefined, { month: "short", day: "numeric", hour: "numeric", minute: "2-digit" });
}
function parseVillageJSON(raw) {
  const parsed = JSON.parse(raw);
  if (typeof parsed.timestamp !== "number") throw new Error("no timestamp");
  const items = [];
  Object.keys(CATEGORY_MAP).forEach((key) => {
    const arr = parsed[key];
    if (!Array.isArray(arr)) return;
    arr.forEach((entry) => {
      if (typeof entry.timer === "number") {
        items.push({
          category: key, id: entry.data, lvl: entry.lvl, timerSec: entry.timer,
          completionMs: (parsed.timestamp + entry.timer) * 1000,
          recurrent: !!entry.helper_recurrent,
        });
      }
    });
  });
  let clockTowerReadyMs = null;
  if (parsed.boosts && typeof parsed.boosts.clocktower_cooldown === "number") {
    clockTowerReadyMs = (parsed.timestamp + parsed.boosts.clocktower_cooldown) * 1000;
  }
  return { importedAt: Date.now(), items, clockTowerReadyMs, tag: parsed.tag || "" };
}

// ---------------- Auth screen ----------------
function AuthScreen({ onAuthed }) {
  const [mode, setMode] = useState("login");
  const [username, setUsername] = useState("");
  const [password, setPassword] = useState("");
  const [error, setError] = useState("");
  const [busy, setBusy] = useState(false);

  const submit = async (e) => {
    e.preventDefault();
    setError("");
    if (!username.trim() || password.length < 6) {
      setError("Username required, password must be at least 6 characters.");
      return;
    }
    setBusy(true);
    const email = usernameToEmail(username);
    try {
      let cred;
      if (mode === "signup") {
        cred = await window.__auth.createUserWithEmailAndPassword(email, password);
        const isAdminUsername = username.trim().toLowerCase() === "admin";
        await window.__db.collection("users").doc(cred.user.uid).set(
          { username: username.trim(), role: isAdminUsername ? "admin" : "member" },
          { merge: true }
        );
      } else {
        cred = await window.__auth.signInWithEmailAndPassword(email, password);
      }
      onAuthed(cred.user);
    } catch (err) {
      if (err.code === "auth/email-already-in-use") setError("That username is already taken.");
      else if (err.code === "auth/user-not-found" || err.code === "auth/wrong-password" || err.code === "auth/invalid-credential") setError("Wrong username or password.");
      else if (err.code === "auth/weak-password") setError("Password must be at least 6 characters.");
      else setError(err.message || "Something went wrong.");
    } finally {
      setBusy(false);
    }
  };

  return (
    <div style={as.wrapper}>
      <div style={as.card}>
        <div style={as.eyebrow}>Village Import</div>
        <h1 style={as.title}>Upgrade Watch</h1>
        <p style={as.sub}>Sign in to see your upgrades from any device.</p>
        <form onSubmit={submit}>
          <input placeholder="Username" value={username} onChange={(e) => setUsername(e.target.value)} style={{ width: "100%", marginBottom: 10 }} />
          <input placeholder="Password (min 6 characters)" type="password" value={password} onChange={(e) => setPassword(e.target.value)} style={{ width: "100%", marginBottom: 10 }} />
          {error && <div style={as.error}>{error}</div>}
          <button type="submit" disabled={busy} className="btn" style={as.submitBtn}>
            {busy ? "Please wait…" : mode === "login" ? "Log in" : "Create account"}
          </button>
        </form>
        <button onClick={() => { setMode(mode === "login" ? "signup" : "login"); setError(""); }} style={as.switchBtn}>
          {mode === "login" ? "New here? Create an account" : "Already have an account? Log in"}
        </button>
      </div>
    </div>
  );
}

// ---------------- Main tracker ----------------
function Tracker({ uid, readOnly, isAdmin, viewingLabel, onOpenAdmin, onLogout }) {
  const [villages, setVillages] = useState({}); // { [tag]: { snapshot, totalBuilders, label } }
  const [activeTag, setActiveTag] = useState(null);
  const [nameMap, setNameMap] = useState({});
  const [dataLoaded, setDataLoaded] = useState(false);
  const [now, setNow] = useState(Date.now());
  const [importOpen, setImportOpen] = useState(false);
  const [rawInput, setRawInput] = useState("");
  const [error, setError] = useState("");
  const [editingId, setEditingId] = useState(null);
  const [editValue, setEditValue] = useState("");
  const [editingTag, setEditingTag] = useState(null);
  const [tagLabelValue, setTagLabelValue] = useState("");
  const [activeFilter, setActiveFilter] = useState(null);
  const [copied, setCopied] = useState(false);
  const [reminderText, setReminderText] = useState(null);
  const [syncState, setSyncState] = useState("idle"); // idle | saving | saved

  const docRef = window.__db.collection("users").doc(uid);
  const saveTimer = useRef(null);

  // load once on mount
  useEffect(() => {
    let cancelled = false;
    docRef.get().then((snap) => {
      if (cancelled) return;
      const d = snap.data() || {};
      const v = d.villages || {};
      setVillages(v);
      if (d.nameMap) setNameMap(d.nameMap);
      const tags = Object.keys(v);
      setActiveTag(d.activeTag && v[d.activeTag] ? d.activeTag : (tags[0] || null));
      setDataLoaded(true);
    }).catch(() => setDataLoaded(true));
    return () => { cancelled = true; };
  }, [uid]);

  // debounced cloud save whenever tracked state changes (skipped when viewing someone else read-only)
  useEffect(() => {
    if (!dataLoaded || readOnly) return;
    setSyncState("saving");
    if (saveTimer.current) clearTimeout(saveTimer.current);
    saveTimer.current = setTimeout(() => {
      docRef.set({ villages, nameMap, activeTag }, { merge: true })
        .then(() => setSyncState("saved"))
        .catch(() => setSyncState("idle"));
    }, 700);
    return () => clearTimeout(saveTimer.current);
  }, [villages, nameMap, activeTag, dataLoaded, readOnly]);

  const villageTags = Object.keys(villages);
  const activeVillage = activeTag ? villages[activeTag] : null;
  const snapshot = activeVillage ? activeVillage.snapshot : null;
  const totalBuilders = activeVillage ? (activeVillage.totalBuilders || 6) : 6;
  const setTotalBuilders = (n) => {
    if (!activeTag) return;
    setVillages((prev) => ({ ...prev, [activeTag]: { ...prev[activeTag], totalBuilders: n } }));
  };

  useEffect(() => {
    const t = setInterval(() => setNow(Date.now()), 1000);
    return () => clearInterval(t);
  }, []);

  const handleImport = useCallback(() => {
    setError("");
    try {
      const result = parseVillageJSON(rawInput.trim());
      if (result.items.length === 0) setError("Parsed fine, but no active upgrades with timers were found.");
      const tag = result.tag && result.tag.trim() ? result.tag.trim() : `village-${Date.now()}`;
      setVillages((prev) => ({
        ...prev,
        [tag]: { snapshot: result, totalBuilders: (prev[tag] && prev[tag].totalBuilders) || 6, label: (prev[tag] && prev[tag].label) || tag },
      }));
      setActiveTag(tag);
      setRawInput("");
      setImportOpen(false);
    } catch (e) {
      setError("Couldn't read that as village JSON. Copy the full text from Data Export.");
    }
  }, [rawInput]);

  const sortedItems = useMemo(() => (snapshot ? [...snapshot.items].sort((a, b) => a.completionMs - b.completionMs) : []), [snapshot]);
  const busyBuilders = useMemo(() => sortedItems.filter((it) => BUILDER_CATEGORIES.includes(it.category) && it.completionMs > now).length, [sortedItems, now]);
  const availableCategories = useMemo(() => {
    const set = new Set(sortedItems.map((it) => it.category));
    return Object.keys(CATEGORY_MAP).filter((k) => set.has(k));
  }, [sortedItems]);
  const filteredItems = useMemo(() => (!activeFilter ? sortedItems : sortedItems.filter((it) => it.category === activeFilter)), [sortedItems, activeFilter]);

  const handleCopySummary = useCallback(() => {
    const lines = sortedItems.filter((it) => it.completionMs > now).map((it) => {
      const name = nameMap[it.id] || `#${it.id}`;
      const cat = (CATEGORY_MAP[it.category] || {}).label || it.category;
      return `${name} (${cat}) — finishes ${formatClockTime(it.completionMs)}`;
    });
    const text = lines.length ? `Set reminders for my Clash of Clans upgrades:\n${lines.join("\n")}` : "No upgrades currently in progress.";
    setReminderText(text);
    let ok = false;
    try { if (navigator.clipboard && navigator.clipboard.writeText) { navigator.clipboard.writeText(text); ok = true; } } catch (e) {}
    if (!ok) {
      try {
        const ta = document.createElement("textarea");
        ta.value = text; ta.style.position = "fixed"; ta.style.opacity = "0";
        document.body.appendChild(ta); ta.focus(); ta.select();
        document.execCommand("copy"); document.body.removeChild(ta);
        ok = true;
      } catch (e) {}
    }
    setCopied(ok);
    if (ok) setTimeout(() => setCopied(false), 2000);
  }, [sortedItems, nameMap, now]);

  const startEdit = (key, current) => { setEditingId(key); setEditValue(current || ""); };
  const commitEdit = (id) => { setNameMap((prev) => ({ ...prev, [id]: editValue.trim() || prev[id] })); setEditingId(null); };
  const readyCount = sortedItems.filter((it) => it.completionMs <= now).length;

  const startTagEdit = (tag) => { setEditingTag(tag); setTagLabelValue(villages[tag].label || tag); };
  const commitTagEdit = (tag) => {
    setVillages((prev) => ({ ...prev, [tag]: { ...prev[tag], label: tagLabelValue.trim() || prev[tag].label } }));
    setEditingTag(null);
  };
  const removeVillage = (tag) => {
    setVillages((prev) => {
      const next = { ...prev };
      delete next[tag];
      return next;
    });
    if (activeTag === tag) {
      const remaining = Object.keys(villages).filter((t) => t !== tag);
      setActiveTag(remaining[0] || null);
    }
  };

  return (
    <div style={s.wrapper}>
      <div style={s.container}>
        <div style={s.header}>
          <div>
            <div style={s.eyebrow}>{readOnly ? `Viewing (read-only)` : "Village Import"}</div>
            <h1 style={s.title}>{readOnly ? viewingLabel : "Upgrade Watch"}</h1>
          </div>
          <div style={s.metaBox}>
            <span style={s.metaValue}>{readOnly ? "" : syncState === "saving" ? "Syncing…" : "Synced ☁"}</span>
            {isAdmin && !readOnly && <button onClick={onOpenAdmin} style={s.logoutBtn}>Admin panel</button>}
            <button onClick={onLogout} style={s.logoutBtn}>{readOnly ? "Back" : "Log out"}</button>
          </div>
        </div>

        {villageTags.length > 0 && (
          <div style={s.filterRow}>
            {villageTags.map((tag) => {
              const isActive = tag === activeTag;
              const isEditingThis = editingTag === tag;
              return (
                <div key={tag} style={{ display: "flex", alignItems: "center", gap: 4 }}>
                  {isEditingThis && !readOnly ? (
                    <input
                      autoFocus
                      value={tagLabelValue}
                      onChange={(e) => setTagLabelValue(e.target.value)}
                      onBlur={() => commitTagEdit(tag)}
                      onKeyDown={(e) => e.key === "Enter" && commitTagEdit(tag)}
                      style={{ width: 100, fontSize: 11 }}
                    />
                  ) : (
                    <button
                      onClick={() => setActiveTag(tag)}
                      onDoubleClick={() => !readOnly && startTagEdit(tag)}
                      style={{ ...s.filterChip, ...(isActive ? s.filterChipActive : {}) }}
                      title={readOnly ? tag : "Tap to switch, double-tap to rename"}
                    >
                      {villages[tag].label || tag}
                    </button>
                  )}
                  {!readOnly && villageTags.length > 1 && (
                    <button onClick={() => removeVillage(tag)} style={s.tagRemoveBtn} title="Remove this village">×</button>
                  )}
                </div>
              );
            })}
          </div>
        )}

        {snapshot && snapshot.clockTowerReadyMs && (
          <div style={s.clockTower}>
            ⏰ Clock Tower boost {snapshot.clockTowerReadyMs <= now ? "ready" : `ready in ${formatRemaining(snapshot.clockTowerReadyMs - now)}`}
          </div>
        )}

        {snapshot && (
          <div style={s.statsBar}>
            <span style={s.statText}><strong style={{ color: "#EDE6D6" }}>{sortedItems.length}</strong><span style={{ color: "#A89A82" }}> upgrades tracked</span></span>
            <span style={s.builderStat}>
              🔨 <strong style={{ color: "#EDE6D6" }}>{busyBuilders}</strong><span style={{ color: "#A89A82" }}>/</span>
              <input type="number" min="1" max="9" value={totalBuilders} onChange={(e) => setTotalBuilders(Math.max(1, Number(e.target.value) || 1))} style={s.builderInput} />
              <span style={{ color: "#A89A82" }}>busy</span>
            </span>
            {readyCount > 0 && <span style={s.readyPill}>{readyCount} ready</span>}
          </div>
        )}

        {snapshot && availableCategories.length > 1 && (
          <div style={s.filterRow}>
            <button onClick={() => setActiveFilter(null)} style={{ ...s.filterChip, ...(activeFilter === null ? s.filterChipActive : {}) }}>All</button>
            {availableCategories.map((key) => (
              <button key={key} onClick={() => setActiveFilter(key)} style={{ ...s.filterChip, ...(activeFilter === key ? { ...s.filterChipActive, borderColor: CATEGORY_MAP[key].color, color: CATEGORY_MAP[key].color } : {}) }}>
                {CATEGORY_MAP[key].label}
              </button>
            ))}
          </div>
        )}

        <div style={s.list}>
          {!snapshot && <div style={s.empty}>No village data yet. Import your export below.</div>}
          {snapshot && sortedItems.length === 0 && <div style={s.empty}>Nothing currently upgrading in your last import.</div>}
          {snapshot && sortedItems.length > 0 && filteredItems.length === 0 && <div style={s.empty}>Nothing in this category right now.</div>}
          {filteredItems.map((it, idx) => {
            const cat = CATEGORY_MAP[it.category] || { label: it.category, color: "#A89A82" };
            const key = `${it.category}-${it.id}-${idx}`;
            const remaining = it.completionMs - now;
            const isReady = remaining <= 0;
            const displayName = nameMap[it.id] || `#${it.id}`;
            const isEditing = editingId === key;
            return (
              <div key={key} className="row" style={s.row}>
                <div style={{ ...s.catPill, borderColor: cat.color, color: cat.color }}>{cat.label}</div>
                <div style={s.rowMain}>
                  <div style={s.rowTop}>
                    {isEditing && !readOnly ? (
                      <input autoFocus value={editValue} onChange={(e) => setEditValue(e.target.value)} onBlur={() => commitEdit(it.id)} onKeyDown={(e) => e.key === "Enter" && commitEdit(it.id)} placeholder={`Name for ${it.id}`} style={{ width: 180 }} />
                    ) : (
                      <span className={readOnly ? "" : "name"} style={s.rowName} onClick={() => !readOnly && startEdit(key, nameMap[it.id])} title={readOnly ? "" : "Click to rename"}>{displayName}{!readOnly && " ✎"}</span>
                    )}
                    <span style={s.rowLevel}>{it.lvl != null ? `→ Lv ${it.lvl}` : ""}</span>
                  </div>
                  <div style={s.rowBottom}>finishes {formatClockTime(it.completionMs)}</div>
                </div>
                <div style={s.rowRight}><span style={{ ...s.countdown, color: isReady ? "#6FAE68" : "#EDE6D6" }}>{formatRemaining(remaining)}</span></div>
              </div>
            );
          })}
        </div>

        {!readOnly && snapshot && sortedItems.length > 0 && (
          <button onClick={handleCopySummary} style={s.copyBtn}>{copied ? "✓ Copied" : "📋 Copy reminder list"}</button>
        )}
        {!readOnly && reminderText && (
          <div style={s.reminderBox}>
            <div style={s.importHint}>If the copy didn't register, tap below, select all, and copy manually.</div>
            <textarea readOnly value={reminderText} rows={4} onFocus={(e) => e.target.select()} style={{ width: "100%", resize: "vertical" }} />
          </div>
        )}

        {!readOnly && (
          <button onClick={() => setImportOpen((o) => !o)} className="btn" style={s.importTrigger}>
            📥 {villageTags.length > 0 ? "Add / update a village" : "Import village JSON"} {importOpen ? "▲" : "▼"}
          </button>
        )}

        {!readOnly && importOpen && (
          <div style={s.importBox}>
            <div style={s.importHint}>In-game: Settings → More Settings → Data Export → Copy. Paste the full text here.</div>
            <textarea value={rawInput} onChange={(e) => setRawInput(e.target.value)} placeholder='{"tag":"#...","timestamp":...,"buildings":[...]}' rows={6} style={{ width: "100%", resize: "vertical" }} />
            {error && <div style={s.errorText}>{error}</div>}
            <div style={s.formActions}>
              <button type="button" style={s.cancelBtn} onClick={() => { setImportOpen(false); setError(""); setRawInput(""); }}>Cancel</button>
              <button type="button" className="btn" style={s.submitBtn} onClick={handleImport}>Parse & track</button>
            </div>
          </div>
        )}

        <div style={s.footnote}>{readOnly ? "You're viewing this player's data as an admin (read-only)." : "Rename an item once and it's remembered across all your villages. Double-tap a village tab to rename it. Import another account's JSON to track it alongside this one."}</div>
      </div>
    </div>
  );
}

function AdminPanel({ myUid, onSelectUser, onBack }) {
  const [users, setUsers] = useState(null);
  const [error, setError] = useState("");

  useEffect(() => {
    window.__db.collection("users").get().then((snap) => {
      const list = [];
      snap.forEach((doc) => list.push({ id: doc.id, ...doc.data() }));
      setUsers(list);
    }).catch((e) => setError(e.message || "Couldn't load users."));
  }, []);

  return (
    <div style={s.wrapper}>
      <div style={s.container}>
        <div style={s.header}>
          <div>
            <div style={s.eyebrow}>Admin</div>
            <h1 style={s.title}>All Players</h1>
          </div>
          <button onClick={onBack} style={s.logoutBtn}>Back to my dashboard</button>
        </div>
        {error && <div style={s.errorText}>{error}</div>}
        {!users && !error && <div style={s.empty}>Loading users…</div>}
        {users && users.length === 0 && <div style={s.empty}>No users yet.</div>}
        <div style={s.list}>
          {users && users.map((u) => (
            <div key={u.id} className="row" style={s.row}>
              <div style={s.rowMain}>
                <div style={s.rowTop}>
                  <span style={s.rowName}>{u.username || u.id}</span>
                  {u.role === "admin" && <span style={s.rowLevel}>admin</span>}
                </div>
                <div style={s.rowBottom}>
                  {u.villages && Object.keys(u.villages).length > 0
                    ? `${Object.keys(u.villages).length} village(s), ${Object.values(u.villages).reduce((sum, v) => sum + ((v.snapshot && v.snapshot.items.length) || 0), 0)} upgrades tracked`
                    : "No village data imported yet"}
                </div>
              </div>
              {u.id !== myUid && (
                <button onClick={() => onSelectUser(u.id, u.username)} style={s.logoutBtn}>View</button>
              )}
            </div>
          ))}
        </div>
      </div>
    </div>
  );
}

function App() {
  const [authChecked, setAuthChecked] = useState(false);
  const [user, setUser] = useState(null);
  const [role, setRole] = useState("member");
  const [username, setUsername] = useState("");
  const [view, setView] = useState("dashboard"); // dashboard | admin
  const [viewingUid, setViewingUid] = useState(null);
  const [viewingName, setViewingName] = useState("");

  useEffect(() => {
    const unsub = window.__auth.onAuthStateChanged(async (u) => {
      setUser(u);
      if (u) {
        try {
          const snap = await window.__db.collection("users").doc(u.uid).get();
          const d = snap.data() || {};
          setRole(d.role === "admin" ? "admin" : "member");
          setUsername(d.username || "");
        } catch (e) {}
      }
      setAuthChecked(true);
    });
    return unsub;
  }, []);

  if (!authChecked) return <div style={s.wrapper}></div>;
  if (!user) return <AuthScreen onAuthed={setUser} />;

  if (view === "admin") {
    return (
      <AdminPanel
        myUid={user.uid}
        onBack={() => setView("dashboard")}
        onSelectUser={(uid, name) => { setViewingUid(uid); setViewingName(name); }}
      />
    );
  }

  if (viewingUid) {
    return (
      <Tracker
        uid={viewingUid}
        readOnly={true}
        viewingLabel={viewingName || viewingUid}
        onLogout={() => { setViewingUid(null); setView("admin"); }}
      />
    );
  }

  return (
    <Tracker
      uid={user.uid}
      readOnly={false}
      isAdmin={role === "admin"}
      onOpenAdmin={() => setView("admin")}
      onLogout={() => window.__auth.signOut()}
    />
  );
}
