<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Clash of Clans — Upgrade Watch</title>
<link rel="icon" href="data:,">
<link rel="stylesheet" href="shared.css">
<style>
  textarea, input { 
    font-family: 'Times New Roman', Times, serif !important;
    background: rgba(255, 255, 255, 0.4) !important; 
    border: 1px solid rgba(255, 255, 255, 0.7) !important; 
    color: #1F2937 !important; 
    border-radius: 10px !important;
    font-weight: 600;
    box-shadow: inset 0 2px 6px rgba(0,0,0,0.02);
  }
  textarea:focus, input:focus { 
    border-color: rgba(255, 255, 255, 1) !important; 
    background: rgba(255, 255, 255, 0.7) !important;
    box-shadow: 0 0 0 4px rgba(255, 255, 255, 0.3) !important;
  }
  textarea::placeholder, input::placeholder { color: #6B7280 !important; opacity: 0.8; }
</style>
</head>
<body>
<div id="root"></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/firebase/12.18.0/firebase-app-compat.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/firebase/12.18.0/firebase-auth-compat.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/firebase/12.18.0/firebase-firestore-compat.min.js"></script>

<script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.23.5/babel.min.js"></script>

<script src="shared.js"></script>

<script type="text/babel" data-presets="react">
const { useState, useEffect } = React;

if (!window.__auth || !window.__db) {
  document.getElementById("root").innerHTML =
    '<div style="color:#EDEAE4;padding:24px;font-family:sans-serif;max-width:400px;margin:60px auto;background:#1C1916;border:1px solid #39352E;">' +
    "Couldn't connect (Firebase didn't load). Check your internet connection and reload the page. " +
    "If this keeps happening, shared.js or the Firebase scripts may not be loading correctly." +
    "</div>";
  throw new Error("Firebase failed to initialize — window.__auth/__db missing.");
}

function AuthScreen({ onAuthed }) {
  const [mode, setMode] = useState("login");
  const [username, setUsername] = useState("");
  const [password, setPassword] = useState("");
  const [error, setError] = useState("");
  const [busy, setBusy] = useState(false);

  const submit = async (e) => {
    e.preventDefault();
    setError("");
    if (!username.trim() || password.length < 6) {
      setError("Username required, password must be at least 6 characters.");
      return;
    }
    setBusy(true);
    const email = usernameToEmail(username);
    try {
      let cred;
      if (mode === "signup") {
        cred = await window.__auth.createUserWithEmailAndPassword(email, password);
        const isAdminUsername = username.trim().toLowerCase() === "admin";
        await window.__db.collection("users").doc(cred.user.uid).set(
          { username: username.trim(), role: isAdminUsername ? "admin" : "member" },
          { merge: true }
        );
      } else {
        cred = await window.__auth.signInWithEmailAndPassword(email, password);
      }
      onAuthed(cred.user);
    } catch (err) {
      if (err.code === "auth/email-already-in-use") setError("That username is already taken.");
      else if (err.code === "auth/user-not-found" || err.code === "auth/wrong-password" || err.code === "auth/invalid-credential") setError("Wrong username or password.");
      else if (err.code === "auth/weak-password") setError("Password must be at least 6 characters.");
      else setError(err.message || "Something went wrong.");
    } finally {
      setBusy(false);
    }
  };

  return (
    <div style={as.wrapper}>
      <div style={as.card}>
        <div style={as.eyebrow}>Village Import</div>
        <h1 style={as.title}>Upgrade Watch</h1>
        <p style={as.sub}>Sign in to see your upgrades from any device.</p>
        <form onSubmit={submit}>
          <input placeholder="Username" value={username} onChange={(e) => setUsername(e.target.value)} style={{ width: "100%", marginBottom: 10 }} />
          <input placeholder="Password (min 6 characters)" type="password" value={password} onChange={(e) => setPassword(e.target.value)} style={{ width: "100%", marginBottom: 10 }} />
          {error && <div style={as.error}>{error}</div>}
          <button type="submit" disabled={busy} className="btn" style={as.submitBtn}>
            {busy ? "Please wait…" : mode === "login" ? "Log in" : "Create account"}
          </button>
        </form>
        <button onClick={() => { setMode(mode === "login" ? "signup" : "login"); setError(""); }} style={as.switchBtn}>
          {mode === "login" ? "New here? Create an account" : "Already have an account? Log in"}
        </button>
      </div>
    </div>
  );
}

function Boot() {
  const [authChecked, setAuthChecked] = useState(false);
  const [user, setUser] = useState(null);

  useEffect(() => {
    const unsub = window.__auth.onAuthStateChanged((u) => { setUser(u); setAuthChecked(true); });
    return unsub;
  }, []);

  useEffect(() => {
    if (authChecked && user) window.location.href = "coc-upgrade.html";
  }, [authChecked, user]);

  if (!authChecked || user) return <div style={as.wrapper}></div>;
  return <AuthScreen onAuthed={() => { window.location.href = "coc-upgrade.html"; }} />;
}
const as = {
  wrapper: { background: "transparent", minHeight: "100vh", display: "flex", alignItems: "center", justifyContent: "center", padding: 20, fontFamily: "'Times New Roman', Times, serif" },
  card: { maxWidth: 360, width: "100%", background: "rgba(255, 255, 255, 0.45)", backdropFilter: "blur(20px)", WebkitBackdropFilter: "blur(20px)", border: "1px solid rgba(255, 255, 255, 0.7)", padding: 30, borderRadius: 20, boxShadow: "0 12px 40px rgba(168, 213, 227, 0.25)" },
  eyebrow: { fontSize: 13, color: "#6B7280", marginBottom: 4, letterSpacing: "0.06em", textTransform: "uppercase", fontWeight: 700 },
  title: { fontFamily: "'Times New Roman', Times, serif", fontWeight: 700, fontSize: 32, color: "#1F2937", margin: "0 0 8px 0" },
  sub: { fontSize: 14, color: "#4B5563", marginBottom: 20, lineHeight: 1.5, fontWeight: 700 },
  error: { color: "#BE123C", fontSize: 14, marginBottom: 14, border: "1px solid rgba(254, 205, 211, 0.8)", padding: "10px 12px", background: "rgba(255, 228, 230, 0.8)", borderRadius: 8, fontWeight: 700 },
  submitBtn: { width: "100%", fontFamily: "'Times New Roman', Times, serif", border: "1px solid rgba(255,255,255,1)", padding: "12px 0", fontSize: 15, fontWeight: 700, cursor: "pointer", color: "#374151", background: "rgba(255, 255, 255, 0.8)", borderRadius: 12, boxShadow: "0 4px 16px rgba(0,0,0,0.06)" },
  switchBtn: { marginTop: 16, width: "100%", fontFamily: "'Times New Roman', Times, serif", background: "transparent", border: "none", color: "#4B5563", fontSize: 14, cursor: "pointer", textDecoration: "underline", fontWeight: 700 },
};

ReactDOM.createRoot(document.getElementById("root")).render(<Boot />);
</script>

<script>
// Plain-JS diagnostic (doesn't depend on Babel/React working at all).
// If the page is still blank after a couple seconds, this shows exactly
// which piece failed to load instead of leaving a silent blank screen.
setTimeout(function () {
  var root = document.getElementById("root");
  if (root && root.children.length === 0) {
    var lines = [
      "firebase: " + typeof firebase,
      "React: " + typeof React,
      "ReactDOM: " + typeof ReactDOM,
      "Babel: " + typeof Babel,
      "window.__auth: " + typeof window.__auth,
      "window.__db: " + typeof window.__db,
      "window.usernameToEmail: " + typeof window.usernameToEmail,
    ];
    root.innerHTML =
      '<div style="color:#EDEAE4;padding:24px;font-family:monospace;font-size:13px;max-width:420px;margin:60px auto;background:#1C1916;border:1px solid #39352E;line-height:1.6;">' +
      "Diagnostic — nothing rendered after 2.5s:<br><br>" +
      lines.join("<br>") +
      "</div>";
  }
}, 2500);
</script>
</body>
</html>
