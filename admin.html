<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Clash of Clans — Admin</title>
<link rel="icon" href="data:,">
<link rel="stylesheet" href="shared.css">
<style>
  textarea, input { 
    font-family: 'Times New Roman', Times, serif !important;
    background: rgba(255, 255, 255, 0.4) !important; 
    border: 1px solid rgba(255, 255, 255, 0.7) !important; 
    color: #1F2937 !important; 
    border-radius: 10px !important;
    font-weight: 600;
    box-shadow: inset 0 2px 6px rgba(0,0,0,0.02);
  }
  textarea:focus, input:focus { 
    border-color: rgba(255, 255, 255, 1) !important; 
    background: rgba(255, 255, 255, 0.7) !important;
    box-shadow: 0 0 0 4px rgba(255, 255, 255, 0.3) !important;
  }
  textarea::placeholder, input::placeholder { color: #6B7280 !important; opacity: 0.8; }
</style>

</head>
<body>
<div id="root"></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/firebase/12.18.0/firebase-app-compat.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/firebase/12.18.0/firebase-auth-compat.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/firebase/12.18.0/firebase-firestore-compat.min.js"></script>

<script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.23.5/babel.min.js"></script>

<script src="shared.js"></script>

<script type="text/babel" data-presets="react">
const { useState, useEffect } = React;

if (!window.__auth || !window.__db) {
  document.getElementById("root").innerHTML =
    '<div style="color:#EDEAE4;padding:24px;font-family:sans-serif;max-width:400px;margin:60px auto;background:#1C1916;border:1px solid #39352E;">' +
    "Couldn't connect (Firebase didn't load). Check your internet connection and reload the page. " +
    "If this keeps happening, shared.js or the Firebase scripts may not be loading correctly." +
    "</div>";
  throw new Error("Firebase failed to initialize — window.__auth/__db missing.");
}

function AdminPanel({ myUid, onSelectUser, onBack }) {
  const [users, setUsers] = useState(null);
  const [error, setError] = useState("");
  const [editingUserId, setEditingUserId] = useState(null);
  const [editNameValue, setEditNameValue] = useState("");

  useEffect(() => {
    window.__db.collection("users").get().then((snap) => {
      const list = [];
      snap.forEach((doc) => list.push({ id: doc.id, ...doc.data() }));
      setUsers(list);
    }).catch((e) => setError(e.message || "Couldn't load users."));
  }, []);

  const startEditName = (u) => { setEditingUserId(u.id); setEditNameValue(u.username || ""); };
  const commitEditName = (userId) => {
    const newName = editNameValue.trim();
    setEditingUserId(null);
    if (!newName) return;
    window.__db.collection("users").doc(userId).set({ username: newName }, { merge: true })
      .then(() => setUsers((prev) => prev.map((u) => (u.id === userId ? { ...u, username: newName } : u))))
      .catch((e) => setError(e.message || "Couldn't update that username."));
  };

  const deleteUser = (u) => {
    const ok = window.confirm(`Delete ${u.username || u.id}'s tracked data? This can't be undone. Their login will still exist, but their imported villages, nicknames, and settings will be wiped.`);
    if (!ok) return;
    window.__db.collection("users").doc(u.id).delete()
      .then(() => setUsers((prev) => prev.filter((x) => x.id !== u.id)))
      .catch((e) => setError(e.message || "Couldn't delete that user."));
  };

  return (
    <div style={s.wrapper}>
      <div style={s.container}>
        <div style={s.header}>
          <div>
            <div style={s.eyebrow}>Admin</div>
            <h1 style={s.title}>All Players</h1>
          </div>
          <button onClick={onBack} style={s.logoutBtn}>Back to my dashboard</button>
        </div>
        {error && <div style={s.errorText}>{error}</div>}
        {!users && !error && <div style={s.empty}>Loading users…</div>}
        {users && users.length === 0 && <div style={s.empty}>No users yet.</div>}
        <div style={s.list}>
          {users && users.map((u) => (
            <div key={u.id} className="row" style={s.row}>
              <div style={s.rowMain}>
                <div style={s.rowTop}>
                  {editingUserId === u.id ? (
                    <input
                      autoFocus
                      value={editNameValue}
                      onChange={(e) => setEditNameValue(e.target.value)}
                      onBlur={() => commitEditName(u.id)}
                      onKeyDown={(e) => e.key === "Enter" && commitEditName(u.id)}
                      style={{ width: 160 }}
                    />
                  ) : (
                    <span className="name" style={s.rowName} onClick={() => startEditName(u)} title="Click to edit this player's display nickname">
                      {u.username || u.id} ✎
                    </span>
                  )}
                  {u.role === "admin" && <span style={s.rowLevel}>admin</span>}
                </div>
                <div style={s.rowBottom}>
                  {u.villages && Object.keys(u.villages).length > 0
                    ? `${Object.keys(u.villages).length} village(s), ${Object.values(u.villages).reduce((sum, v) => sum + ((v.snapshot && v.snapshot.items.length) || 0), 0)} upgrades tracked`
                    : "No village data imported yet"}
                </div>
              </div>
              {u.id !== myUid && (
                <div style={{ display: "flex", gap: 6 }}>
                  <button onClick={() => onSelectUser(u.id, u.username)} style={s.logoutBtn}>View</button>
                  <button onClick={() => deleteUser(u)} style={s.deleteBtn}>Delete</button>
                </div>
              )}
            </div>
          ))}
        </div>
        <div style={s.footnote}>The name shown here is a display nickname only — it does NOT change what a player types to log in. Every player's login username is fixed at signup and can't be changed by admin (same as passwords: never viewable, and not changeable for another account from here).</div>
      </div>
    </div>
  );
}

function Boot() {
  const [authChecked, setAuthChecked] = useState(false);
  const [user, setUser] = useState(null);
  const [role, setRole] = useState("member");

  useEffect(() => {
    const unsub = window.__auth.onAuthStateChanged(async (u) => {
      setUser(u);
      if (u) {
        try {
          const snap = await window.__db.collection("users").doc(u.uid).get();
          const d = snap.data() || {};
          setRole(d.role === "admin" ? "admin" : "member");
        } catch (e) {}
      }
      setAuthChecked(true);
    });
    return unsub;
  }, []);

  useEffect(() => {
    if (!authChecked) return;
    if (!user) { window.location.href = "index.html"; return; }
    if (role !== "admin") { window.location.href = "coc-upgrade.html"; }
  }, [authChecked, user, role]);

  if (!authChecked || !user || role !== "admin") return <div style={s.wrapper}></div>;

  return (
    <AdminPanel
      myUid={user.uid}
      onBack={() => { window.location.href = "coc-upgrade.html"; }}
      onSelectUser={(uid, name) => {
        window.location.href = `coc-upgrade.html?viewUid=${encodeURIComponent(uid)}&viewName=${encodeURIComponent(name || uid)}`;
      }}
    />
  );
}

const s = {
  wrapper: { background: "transparent", minHeight: "100vh", padding: "24px 16px", fontFamily: "'Times New Roman', Times, serif" },
  container: { maxWidth: 640, margin: "0 auto", background: "rgba(255, 255, 255, 0.45)", backdropFilter: "blur(20px)", WebkitBackdropFilter: "blur(20px)", border: "1px solid rgba(255, 255, 255, 0.7)", padding: 28, borderRadius: 20, boxShadow: "0 12px 40px rgba(168, 213, 227, 0.25)" },
  header: { display: "flex", justifyContent: "space-between", alignItems: "flex-end", marginBottom: 18 },
  eyebrow: { fontSize: 13, color: "#6B7280", letterSpacing: "0.06em", marginBottom: 4, textTransform: "uppercase", fontWeight: 700 },
  title: { fontFamily: "'Times New Roman', Times, serif", fontWeight: 700, fontSize: 30, color: "#1F2937", margin: 0 },
  
  logoutBtn: { fontSize: 13, fontFamily: "'Times New Roman', Times, serif", color: "#4B5563", background: "rgba(255, 255, 255, 0.5)", border: "1px solid rgba(255, 255, 255, 0.8)", padding: "6px 14px", cursor: "pointer", borderRadius: 8, fontWeight: 700, boxShadow: "0 2px 8px rgba(0,0,0,0.04)" },
  deleteBtn: { fontSize: 13, fontFamily: "'Times New Roman', Times, serif", color: "#D94672", background: "rgba(255, 120, 172, 0.15)", border: "1px solid rgba(255, 120, 172, 0.3)", padding: "6px 14px", cursor: "pointer", borderRadius: 8, fontWeight: 700 },
  
  list: { marginTop: 12 },
  empty: { color: "#6B7280", fontSize: 15, padding: "32px 4px", textAlign: "center", fontStyle: "italic", fontWeight: 700 },
  row: { display: "flex", alignItems: "center", gap: 14, padding: "14px 6px", borderBottom: "1px solid rgba(255,255,255,0.5)" },
  rowMain: { flex: 1, minWidth: 0 },
  rowTop: { display: "flex", alignItems: "baseline", gap: 8, marginBottom: 4 },
  rowName: { fontSize: 17, color: "#1F2937", fontWeight: 700, cursor: "pointer" },
  rowLevel: { fontSize: 14, color: "#748CAB", fontWeight: 700, whiteSpace: "nowrap" },
  rowBottom: { fontSize: 14, color: "#6B7280", fontWeight: 700 },
  
  errorText: { color: "#BE123C", fontSize: 14, margin: "10px 0", border: "1px solid rgba(254, 205, 211, 0.8)", padding: "8px 12px", background: "rgba(255, 228, 230, 0.8)", borderRadius: 8, fontWeight: 700 },
  footnote: { marginTop: 20, fontSize: 13, color: "#6B7280", lineHeight: 1.6, textAlign: "center", fontWeight: 700 },
};


ReactDOM.createRoot(document.getElementById("root")).render(<Boot />);
</script>

<script>
setTimeout(function () {
  var root = document.getElementById("root");
  if (root && root.children.length === 0) {
    var lines = [
      "firebase: " + typeof firebase,
      "React: " + typeof React,
      "ReactDOM: " + typeof ReactDOM,
      "Babel: " + typeof Babel,
      "window.__auth: " + typeof window.__auth,
      "window.__db: " + typeof window.__db,
    ];
    root.innerHTML =
      '<div style="color:#EDEAE4;padding:24px;font-family:monospace;font-size:13px;max-width:420px;margin:60px auto;background:#1C1916;border:1px solid #39352E;line-height:1.6;">' +
      "Diagnostic — nothing rendered after 2.5s:<br><br>" +
      lines.join("<br>") +
      "</div>";
  }
}, 2500);
</script>
</body>
</html>
