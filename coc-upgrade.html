<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Clash of Clans — Upgrade Watch</title>
<link rel="icon" href="data:,">
<link rel="stylesheet" href="shared.css">
<style>
  textarea, input { 
    background: rgba(255, 255, 255, 0.6) !important; 
    border: 1px solid rgba(255, 255, 255, 0.9) !important; 
    color: #0F172A !important; 
    border-radius: 8px !important;
    font-weight: 500;
    box-shadow: inset 0 2px 4px rgba(0,0,0,0.02);
  }
  textarea:focus, input:focus { 
    border-color: #4F46E5 !important; 
    background: rgba(255, 255, 255, 0.9) !important;
    box-shadow: 0 0 0 3px rgba(79, 70, 229, 0.2) !important;
  }
  textarea::placeholder, input::placeholder { color: #64748B !important; opacity: 0.9; }
</style>

</head>
<body>
<div id="root"></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/firebase/12.18.0/firebase-app-compat.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/firebase/12.18.0/firebase-auth-compat.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/firebase/12.18.0/firebase-firestore-compat.min.js"></script>

<script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.23.5/babel.min.js"></script>

<script src="shared.js"></script>

<script type="text/babel" data-presets="react">
const { useState, useEffect, useMemo, useCallback, useRef } = React;

if (!window.__auth || !window.__db) {
  document.getElementById("root").innerHTML =
    '<div style="color:#EDEAE4;padding:24px;font-family:sans-serif;max-width:400px;margin:60px auto;background:#1C1916;border:1px solid #39352E;">' +
    "Couldn't connect (Firebase didn't load). Check your internet connection and reload the page. " +
    "If this keeps happening, shared.js or the Firebase scripts may not be loading correctly." +
    "</div>";
  throw new Error("Firebase failed to initialize — window.__auth/__db missing.");
}

// ---------------- Main tracker ----------------
function Tracker({ uid, readOnly, isAdmin, viewingLabel, onOpenAdmin, onLogout }) {
  const [villages, setVillages] = useState({}); // { [tag]: { snapshot, totalBuilders, label } }
  const [activeTag, setActiveTag] = useState(null);
  const [nameMap, setNameMap] = useState({});
  const [maxLevelMap, setMaxLevelMap] = useState({});
  const [dataLoaded, setDataLoaded] = useState(false);
  const [now, setNow] = useState(Date.now());
  const [importOpen, setImportOpen] = useState(false);
  const [rawInput, setRawInput] = useState("");
  const [nicknameInput, setNicknameInput] = useState("");
  const [error, setError] = useState("");
  const [editingMaxId, setEditingMaxId] = useState(null);
  const [maxEditValue, setMaxEditValue] = useState("");
  const [editingTag, setEditingTag] = useState(null);
  const [tagLabelValue, setTagLabelValue] = useState("");
  const [activeFilter, setActiveFilter] = useState(null);
  const [copied, setCopied] = useState(false);
  const [reminderText, setReminderText] = useState(null);
  const [syncState, setSyncState] = useState("idle"); // idle | saving | saved
  const [pwOpen, setPwOpen] = useState(false);
  const [currentPassword, setCurrentPassword] = useState("");
  const [newPassword, setNewPassword] = useState("");
  const [confirmPassword, setConfirmPassword] = useState("");
  const [pwError, setPwError] = useState("");
  const [pwSuccess, setPwSuccess] = useState(false);
  const [pwBusy, setPwBusy] = useState(false);

  const docRef = window.__db.collection("users").doc(uid);
  const saveTimer = useRef(null);

  // load once on mount
  useEffect(() => {
    let cancelled = false;
    docRef.get().then((snap) => {
      if (cancelled) return;
      const d = snap.data() || {};
      // Backward-compat: older accounts stored a single top-level `snapshot`.
      // Migrate that in-memory into the villages map so existing data is never lost.
      let v = d.villages || {};
      if (Object.keys(v).length === 0 && d.snapshot) {
        const legacyTag = d.snapshot.tag || "main";
        v = { [legacyTag]: { snapshot: d.snapshot, totalBuilders: d.totalBuilders || 6, label: legacyTag } };
      }
      setVillages(v);
      if (d.nameMap) setNameMap(d.nameMap);
      if (d.maxLevelMap) setMaxLevelMap(d.maxLevelMap);
      const tags = Object.keys(v);
      setActiveTag(d.activeTag && v[d.activeTag] ? d.activeTag : (tags[0] || null));
      setDataLoaded(true);
    }).catch(() => setDataLoaded(true));
    return () => { cancelled = true; };
  }, [uid]);

  // debounced cloud save whenever tracked state changes (skipped when viewing someone else read-only)
  useEffect(() => {
    if (!dataLoaded || readOnly) return;
    setSyncState("saving");
    if (saveTimer.current) clearTimeout(saveTimer.current);
    saveTimer.current = setTimeout(() => {
      docRef.set({ villages, nameMap, maxLevelMap, activeTag }, { merge: true })
        .then(() => setSyncState("saved"))
        .catch(() => setSyncState("idle"));
    }, 700);
    return () => clearTimeout(saveTimer.current);
  }, [villages, nameMap, maxLevelMap, activeTag, dataLoaded, readOnly]);

  const villageTags = Object.keys(villages);
  const activeVillage = activeTag ? villages[activeTag] : null;
  const snapshot = activeVillage ? activeVillage.snapshot : null;
  const totalBuilders = activeVillage ? (activeVillage.totalBuilders || 6) : 6;
  const setTotalBuilders = (n) => {
    if (!activeTag) return;
    setVillages((prev) => ({ ...prev, [activeTag]: { ...prev[activeTag], totalBuilders: n } }));
  };

  useEffect(() => {
    const t = setInterval(() => setNow(Date.now()), 1000);
    return () => clearInterval(t);
  }, []);

  const handleImport = useCallback(() => {
    setError("");
    try {
      const result = parseVillageJSON(rawInput.trim());
      if (result.items.length === 0) setError("Parsed fine, but no active upgrades with timers were found.");
      const tag = result.tag && result.tag.trim() ? result.tag.trim() : `village-${Date.now()}`;
      const nickname = nicknameInput.trim();
      setVillages((prev) => ({
        ...prev,
        [tag]: {
          snapshot: result,
          totalBuilders: (prev[tag] && prev[tag].totalBuilders) || 6,
          label: nickname || (prev[tag] && prev[tag].label) || "",
        },
      }));
      setActiveTag(tag);
      setRawInput("");
      setNicknameInput("");
      setImportOpen(false);
      if (!nickname && !(villages[tag] && villages[tag].label)) {
        setEditingTag(tag);
        setTagLabelValue("");
      }
    } catch (e) {
      setError("Couldn't read that as village JSON. Copy the full text from Data Export.");
    }
  }, [rawInput, nicknameInput, villages]);

  const sortedItems = useMemo(() => (snapshot ? [...snapshot.items].sort((a, b) => a.completionMs - b.completionMs) : []), [snapshot]);
  const busyBuilders = useMemo(() => sortedItems.filter((it) => BUILDER_CATEGORIES.includes(it.category) && it.completionMs > now).length, [sortedItems, now]);
  const availableCategories = useMemo(() => {
    const set = new Set(sortedItems.map((it) => it.category));
    return Object.keys(CATEGORY_MAP).filter((k) => set.has(k));
  }, [sortedItems]);
  const filteredItems = useMemo(() => (!activeFilter ? sortedItems : sortedItems.filter((it) => it.category === activeFilter)), [sortedItems, activeFilter]);

  const handleCopySummary = useCallback(() => {
    const lines = sortedItems.filter((it) => it.completionMs > now).map((it) => {
      const name = nameMap[it.id] || DEFAULT_NAMES[String(it.id)] || `#${it.id}`;
      const cat = (CATEGORY_MAP[it.category] || {}).label || it.category;
      return `${name} (${cat}) — finishes ${formatClockTime(it.completionMs)}`;
    });
    const text = lines.length ? `Set reminders for my Clash of Clans upgrades:\n${lines.join("\n")}` : "No upgrades currently in progress.";
    setReminderText(text);
    let ok = false;
    try { if (navigator.clipboard && navigator.clipboard.writeText) { navigator.clipboard.writeText(text); ok = true; } } catch (e) {}
    if (!ok) {
      try {
        const ta = document.createElement("textarea");
        ta.value = text; ta.style.position = "fixed"; ta.style.opacity = "0";
        document.body.appendChild(ta); ta.focus(); ta.select();
        document.execCommand("copy"); document.body.removeChild(ta);
        ok = true;
      } catch (e) {}
    }
    setCopied(ok);
    if (ok) setTimeout(() => setCopied(false), 2000);
  }, [sortedItems, nameMap, now]);

  const startMaxEdit = (key, current) => { setEditingMaxId(key); setMaxEditValue(current || ""); };
  const commitMaxEdit = (id) => { setMaxLevelMap((prev) => ({ ...prev, [id]: maxEditValue.trim() })); setEditingMaxId(null); };
  const readyCount = sortedItems.filter((it) => it.completionMs <= now).length;

  const startTagEdit = (tag) => { setEditingTag(tag); setTagLabelValue(villages[tag].label || ""); };
  const commitTagEdit = (tag) => {
    setVillages((prev) => ({ ...prev, [tag]: { ...prev[tag], label: tagLabelValue.trim() || prev[tag].label } }));
    setEditingTag(null);
  };
  const removeVillage = (tag) => {
    setVillages((prev) => {
      const next = { ...prev };
      delete next[tag];
      return next;
    });
    if (activeTag === tag) {
      const remaining = Object.keys(villages).filter((t) => t !== tag);
      setActiveTag(remaining[0] || null);
    }
  };

  const handleChangePassword = useCallback(async () => {
    setPwError("");
    setPwSuccess(false);
    if (!currentPassword) { setPwError("Enter your current password."); return; }
    if (newPassword.length < 6) { setPwError("New password must be at least 6 characters."); return; }
    if (newPassword !== confirmPassword) { setPwError("New passwords don't match."); return; }
    setPwBusy(true);
    try {
      const user = window.__auth.currentUser;
      const cred = firebase.auth.EmailAuthProvider.credential(user.email, currentPassword);
      await user.reauthenticateWithCredential(cred);
      await user.updatePassword(newPassword);
      setPwSuccess(true);
      setCurrentPassword("");
      setNewPassword("");
      setConfirmPassword("");
    } catch (e) {
      if (e.code === "auth/wrong-password" || e.code === "auth/invalid-credential") setPwError("Current password is incorrect.");
      else if (e.code === "auth/weak-password") setPwError("New password must be at least 6 characters.");
      else setPwError(e.message || "Couldn't change password.");
    } finally {
      setPwBusy(false);
    }
  }, [currentPassword, newPassword, confirmPassword]);

  return (
    <div style={s.wrapper}>
      <div style={s.container}>
        <div style={s.header}>
          <div>
            <div style={s.eyebrow}>{readOnly ? `Viewing (read-only)` : "Village Import"}</div>
            <h1 style={s.title}>{readOnly ? viewingLabel : "Upgrade Watch"}</h1>
          </div>
          <div style={s.metaBox}>
            <span className={syncState === "saving" ? "syncing" : ""} style={s.metaValue}>{readOnly ? "" : syncState === "saving" ? "Syncing…" : "Synced ☁"}</span>
            {isAdmin && !readOnly && <button onClick={onOpenAdmin} style={s.logoutBtn}>Admin panel</button>}
            {!readOnly && <button onClick={() => setPwOpen((o) => !o)} style={s.logoutBtn}>Change password</button>}
            <button onClick={onLogout} style={s.logoutBtn}>{readOnly ? "Back" : "Log out"}</button>
          </div>
        </div>

        {!readOnly && pwOpen && (
          <div className="panel-in" style={s.importBox}>
            <div style={s.importHint}>Enter your current password, then your new one.</div>
            <input
              type="password"
              placeholder="Current password"
              value={currentPassword}
              onChange={(e) => setCurrentPassword(e.target.value)}
              style={{ width: "100%", marginBottom: 8 }}
            />
            <input
              type="password"
              placeholder="New password (min 6 characters)"
              value={newPassword}
              onChange={(e) => setNewPassword(e.target.value)}
              style={{ width: "100%", marginBottom: 8 }}
            />
            <input
              type="password"
              placeholder="Confirm new password"
              value={confirmPassword}
              onChange={(e) => setConfirmPassword(e.target.value)}
              style={{ width: "100%" }}
            />
            {pwError && <div style={s.errorText}>{pwError}</div>}
            {pwSuccess && <div style={{ ...s.errorText, color: "#8FCBEA", borderColor: "#2C4A5A" }}>Password changed.</div>}
            <div style={s.formActions}>
              <button
                type="button"
                style={s.cancelBtn}
                onClick={() => { setPwOpen(false); setPwError(""); setPwSuccess(false); setCurrentPassword(""); setNewPassword(""); setConfirmPassword(""); }}
              >
                Close
              </button>
              <button type="button" className="btn" style={s.submitBtn} onClick={handleChangePassword} disabled={pwBusy}>
                {pwBusy ? "Please wait…" : "Update password"}
              </button>
            </div>
          </div>
        )}

        {villageTags.length > 0 && (
          <div style={s.filterRow}>
            {villageTags.map((tag) => {
              const isActive = tag === activeTag;
              const isEditingThis = editingTag === tag;
              return (
                <div key={tag} style={{ display: "flex", alignItems: "center", gap: 4 }}>
                  {isEditingThis && !readOnly ? (
                    <input
                      autoFocus
                      value={tagLabelValue}
                      onChange={(e) => setTagLabelValue(e.target.value)}
                      onBlur={() => commitTagEdit(tag)}
                      onKeyDown={(e) => e.key === "Enter" && commitTagEdit(tag)}
                      placeholder="Player name"
                      style={{ width: 110, fontSize: 11 }}
                    />
                  ) : (
                    <button
                      onClick={() => setActiveTag(tag)}
                      onDoubleClick={() => !readOnly && startTagEdit(tag)}
                      style={{ ...s.filterChip, ...(isActive ? s.filterChipActive : {}) }}
                      title={readOnly ? tag : "Tap to switch, double-tap to rename"}
                    >
                      {villages[tag].label || (readOnly ? tag : "Unnamed — tap to name")}
                    </button>
                  )}
                  {!readOnly && villageTags.length > 1 && (
                    <button onClick={() => removeVillage(tag)} style={s.tagRemoveBtn} title="Remove this village">×</button>
                  )}
                </div>
              );
            })}
          </div>
        )}

        {snapshot && snapshot.clockTowerReadyMs && (
          <div style={s.clockTower}>
            <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="#5FB0E0" strokeWidth="2" style={{ marginRight: 5, flexShrink: 0 }}>
              <circle cx="12" cy="12" r="9" />
              <path d="M12 7v5l3 3" />
            </svg>
            Clock Tower boost {snapshot.clockTowerReadyMs <= now ? "ready" : `ready in ${formatRemaining(snapshot.clockTowerReadyMs - now)}`}
          </div>
        )}

        {snapshot && (
          <div style={s.statsBar}>
            <span style={s.statText}><strong style={{ color: "#EDEAE4" }}>{sortedItems.length}</strong><span style={{ color: "#A7A29A" }}> upgrades tracked</span></span>
            <span style={s.builderStat}>
              🔨 <strong style={{ color: "#EDEAE4" }}>{busyBuilders}</strong><span style={{ color: "#A7A29A" }}>/</span>
              <input type="number" min="1" max="9" value={totalBuilders} onChange={(e) => setTotalBuilders(Math.max(1, Number(e.target.value) || 1))} style={s.builderInput} />
              <span style={{ color: "#A7A29A" }}>busy</span>
            </span>
            {readyCount > 0 && <span className="pulse-ready-bg" style={s.readyPill}>{readyCount} ready</span>}
          </div>
        )}

        {snapshot && availableCategories.length > 1 && (
          <div style={s.filterRow}>
            <button onClick={() => setActiveFilter(null)} style={{ ...s.filterChip, ...(activeFilter === null ? s.filterChipActive : {}) }}>All</button>
            {availableCategories.map((key) => (
              <button key={key} onClick={() => setActiveFilter(key)} style={{ ...s.filterChip, ...(activeFilter === key ? { ...s.filterChipActive, borderColor: CATEGORY_MAP[key].color, color: CATEGORY_MAP[key].color } : {}) }}>
                {CATEGORY_MAP[key].label}
              </button>
            ))}
          </div>
        )}

        <div style={s.list}>
          {!snapshot && <div style={s.empty}>No village data yet. Import your export below.</div>}
          {snapshot && sortedItems.length === 0 && <div style={s.empty}>Nothing currently upgrading in your last import.</div>}
          {snapshot && sortedItems.length > 0 && filteredItems.length === 0 && <div style={s.empty}>Nothing in this category right now.</div>}
          {filteredItems.map((it, idx) => {
            const cat = CATEGORY_MAP[it.category] || { label: it.category, color: "#A7A29A" };
            const key = `${it.category}-${it.id}-${idx}`;
            const remaining = it.completionMs - now;
            const isReady = remaining <= 0;
            const displayName = nameMap[it.id] || DEFAULT_NAMES[String(it.id)] || `#${it.id}`;
            return (
              <div key={key} className="row" style={s.row}>
                <div style={{ ...s.catPill, borderColor: cat.color, color: cat.color }}>{cat.label}</div>
                <div style={s.rowMain}>
                  <div style={s.rowTop}>
                    <span style={s.rowName}>{displayName}</span>
                    <span style={s.rowLevel}>{it.lvl != null ? `→ Lv ${it.lvl}` : ""}</span>
                    {it.lvl != null && (
                      editingMaxId === key && !readOnly ? (
                        <input
                          autoFocus
                          value={maxEditValue}
                          onChange={(e) => setMaxEditValue(e.target.value)}
                          onBlur={() => commitMaxEdit(it.id)}
                          onKeyDown={(e) => e.key === "Enter" && commitMaxEdit(it.id)}
                          placeholder="max"
                          style={{ width: 40, fontSize: 11 }}
                        />
                      ) : (
                        <span
                          className={readOnly ? "" : "name"}
                          style={s.rowMaxLevel}
                          onClick={() => !readOnly && startMaxEdit(key, maxLevelMap[it.id])}
                          title={readOnly ? "" : "Click to set this item's max level"}
                        >
                          / {maxLevelMap[it.id] || "max?"}
                        </span>
                      )
                    )}
                    {!readOnly && it.lvl != null && displayName && !displayName.startsWith("#") && (
                      <a
                        href={`https://clashofclans.fandom.com/wiki/Special:Search?query=${encodeURIComponent(displayName)}`}
                        target="_blank"
                        rel="noopener noreferrer"
                        style={s.wikiLink}
                        title="Look up max level on the Clash of Clans Wiki"
                      >
                        🔍
                      </a>
                    )}
                  </div>
                  <div style={s.rowBottom}>finishes {formatClockTime(it.completionMs)}</div>
                </div>
                <div style={s.rowRight}><span className={isReady ? "pulse-ready" : ""} style={{ ...s.countdown, color: isReady ? "#B44B4B" : "#EDEAE4" }}>{formatRemaining(remaining)}</span></div>
              </div>
            );
          })}
        </div>

        {!readOnly && snapshot && sortedItems.length > 0 && (
          <button onClick={handleCopySummary} style={s.copyBtn}>{copied ? "✓ Copied" : "📋 Copy reminder list"}</button>
        )}
        {!readOnly && reminderText && (
          <div className="panel-in" style={s.reminderBox}>
            <div style={s.importHint}>If the copy didn't register, tap below, select all, and copy manually.</div>
            <textarea readOnly value={reminderText} rows={4} onFocus={(e) => e.target.select()} style={{ width: "100%", resize: "vertical" }} />
          </div>
        )}

        {!readOnly && (
          <button onClick={() => setImportOpen((o) => !o)} className="btn" style={s.importTrigger}>
            📥 {villageTags.length > 0 ? "Add / update a village" : "Import village JSON"} {importOpen ? "▲" : "▼"}
          </button>
        )}

        {!readOnly && importOpen && (
          <div className="panel-in" style={s.importBox}>
            <div style={s.importHint}>In-game: Settings → More Settings → Data Export → Copy. Paste the full text here.</div>
            <input
              value={nicknameInput}
              onChange={(e) => setNicknameInput(e.target.value)}
              placeholder="Player/base nickname (optional, e.g. Main Base)"
              style={{ width: "100%", marginBottom: 8 }}
            />
            <textarea value={rawInput} onChange={(e) => setRawInput(e.target.value)} placeholder='{"tag":"#...","timestamp":...,"buildings":[...]}' rows={6} style={{ width: "100%", resize: "vertical" }} />
            {error && <div style={s.errorText}>{error}</div>}
            <div style={s.formActions}>
              <button type="button" style={s.cancelBtn} onClick={() => { setImportOpen(false); setError(""); setRawInput(""); setNicknameInput(""); }}>Cancel</button>
              <button type="button" className="btn" style={s.submitBtn} onClick={handleImport}>Parse & track</button>
            </div>
          </div>
        )}

        <div style={s.footnote}>{readOnly ? "You're viewing this player's data as an admin (read-only)." : "Item names are fixed (not editable). Double-tap a village tab to rename it. Import another account's JSON to track it alongside this one."}</div>
      </div>
    </div>
  );
}

function Boot() {
  const [authChecked, setAuthChecked] = useState(false);
  const [user, setUser] = useState(null);
  const [role, setRole] = useState("member");
  const params = new URLSearchParams(window.location.search);
  const viewUid = params.get("viewUid");
  const viewName = params.get("viewName");

  useEffect(() => {
    const unsub = window.__auth.onAuthStateChanged(async (u) => {
      setUser(u);
      if (u) {
        try {
          const snap = await window.__db.collection("users").doc(u.uid).get();
          const d = snap.data() || {};
          setRole(d.role === "admin" ? "admin" : "member");
        } catch (e) {}
      }
      setAuthChecked(true);
    });
    return unsub;
  }, []);

  useEffect(() => {
    if (authChecked && !user) window.location.href = "index.html";
  }, [authChecked, user]);

  if (!authChecked || !user) return <div style={s.wrapper}></div>;

  if (viewUid && role === "admin") {
    return (
      <Tracker
        uid={viewUid}
        readOnly={true}
        viewingLabel={viewName || viewUid}
        onLogout={() => { window.location.href = "admin.html"; }}
      />
    );
  }

  return (
    <Tracker
      uid={user.uid}
      readOnly={false}
      isAdmin={role === "admin"}
      onOpenAdmin={() => { window.location.href = "admin.html"; }}
      onLogout={() => window.__auth.signOut().then(() => { window.location.href = "index.html"; })}
    />
  );
}
const s = {
  wrapper: { background: "transparent", minHeight: "100vh", padding: "24px 16px", fontFamily: "'Inter', sans-serif" },
  // Premium Glass Effect Container
  container: { maxWidth: 640, margin: "0 auto", background: "rgba(255, 255, 255, 0.75)", backdropFilter: "blur(16px)", WebkitBackdropFilter: "blur(16px)", border: "1px solid rgba(255, 255, 255, 1)", padding: 28, borderRadius: 16, boxShadow: "0 10px 40px rgba(0, 0, 0, 0.08)" },
  header: { display: "flex", justifyContent: "space-between", alignItems: "flex-end", marginBottom: 18 },
  eyebrow: { fontSize: 12, color: "#64748B", letterSpacing: "0.06em", marginBottom: 4, textTransform: "uppercase", fontWeight: 600 },
  title: { fontFamily: "'Bitter', serif", fontWeight: 700, fontSize: 28, color: "#0F172A", margin: 0 },
  metaBox: { display: "flex", flexDirection: "column", alignItems: "flex-end", gap: 6 },
  metaLabel: { fontSize: 10, color: "#64748B" },
  metaValue: { fontSize: 11, color: "#475569", fontWeight: 500 },
  
  // Buttons
  logoutBtn: { fontSize: 11, color: "#475569", background: "rgba(255, 255, 255, 0.6)", border: "1px solid rgba(255, 255, 255, 0.9)", padding: "4px 10px", cursor: "pointer", borderRadius: 6, fontWeight: 500, boxShadow: "0 2px 4px rgba(0,0,0,0.02)" },
  deleteBtn: { fontSize: 11, color: "#EF4444", background: "rgba(254, 226, 226, 0.8)", border: "1px solid #FECACA", padding: "4px 10px", cursor: "pointer", borderRadius: 6, fontWeight: 600 },
